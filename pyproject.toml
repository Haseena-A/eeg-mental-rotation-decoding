[project]
name = "eeg-mental-rotation"
version = "0.1.0"
description = "Participant-independent EEG models of accuracy and response time during mental rotation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nuomics computational neuroscience project" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "statsmodels>=0.14",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "nbformat>=5.9"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
